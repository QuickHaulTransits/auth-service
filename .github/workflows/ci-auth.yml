name: CI — Auth Service

on:
  push:
    branches:
      - develop
      - main
      - feature/ci-auth
  pull_request:
    branches:
      - develop
      - main
      # - feature/ci-auth

permissions:
  contents: write
  packages: write

jobs:
  # 1. Code Quality (SonarQube)
  sonarqube:
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_sonarqube.yml@feature/templates
    with:
      service-path: .
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # 2. Dependency Scan (Snyk)
  snyk:
    needs: sonarqube
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_snyk-python.yml@feature/templates
    with:
      service-name: auth-service
      service-path: .
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # 3. Build & Push to GHCR
  ghcr:
    needs: [sonarqube, snyk]
    if: github.event_name == 'push'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_docker-ci.yml@feature/templates
    with:
      image-name: quickhaul-auth
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # 4. Container Scan (Trivy)
  trivy:
    needs: ghcr
    if: github.event_name == 'push'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_trivy.yml@feature/templates
    with:
      image-name: quickhaul-auth
    secrets:
      DOCKER_USERNAME: ${{ github.actor }}
      DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # 5. Failure Notification
  notification:
    needs: [sonarqube, snyk, ghcr, trivy]
    if: failure()
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_notify.yml@feature/templates
    with:
      service-name: auth-service
      subject: "🚨 CI/CD Failure: Auth Service"
      body: "The pipeline for auth-service has failed. Please review the logs and security scans."
    secrets:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}