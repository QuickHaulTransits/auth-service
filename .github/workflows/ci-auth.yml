name: CI — Auth Service

on:
  push:
    branches:
      - develop
      - main
      # - feature/ci-auth
  pull_request:
    branches:
      - develop
      - main
permissions:
  contents: write

jobs:
  sast:
    if: github.event_name == 'pull_request'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_sast.yml@feature/templates
    with:
      service-path: .
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_URL: ${{ secrets.SONAR_HOST_URL }}

  # ─── SCA (Snyk) ───
  sca:
    needs: [sast]
    if: github.event_name == 'pull_request'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_sca.yml@feature/templates
    with:
      service-name: auth-service
      service-path: .
      runtime: python
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ─── Notify: Snyk Criticals ───
  notify-snyk:
    needs: [sca]
    if: needs.sca.outputs.critical-found == 'true'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_notify.yml@feature/templates
    with:
      service-name: auth-service
    secrets:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

  # ─── Temp Docker Build + Trivy Scan ───
  build:
    needs: [sast, sca]
    if: github.event_name == 'pull_request'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_docker-build.yml@feature/templates
    with:
      service-name: auth-service
      service-path: .

  # ─── Notify: Trivy Criticals ───
  notify-trivy:
    needs: [build]
    if: needs.build.outputs.trivy-critical == 'true'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_notify.yml@feature/templates
    with:
      service-name: auth-service
    secrets:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

  # ─── Publish Docker Image (Tag + Build + Push) ───
  publish:
    if: github.event_name == 'push'
    uses: QuickHaulTransits/quickhaul-templates/.github/workflows/_docker-publish.yml@feature/templates
    with:
      service-name: auth-service
      environment: ${{ github.ref_name }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}

